[unix_http_server]
file=/tmp/supervisor.sock
chmod=0770
chown=root:suprclaw

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:suprclaw-engine-gateway]
user=suprclaw
environment=HOME="/home/suprclaw",SUPRCLAW_HOME="/home/suprclaw/.suprclaw",SUPRCLAW_CONFIG="/home/suprclaw/.suprclaw/config.json",SUPRCLAW_ENGINE_HOME="/home/suprclaw/.suprclaw",SUPRCLAW_ENGINE_CONFIG="/home/suprclaw/.suprclaw/config.json",PICOCLAW_HOME="/home/suprclaw/.suprclaw",PICOCLAW_CONFIG="/home/suprclaw/.suprclaw/config.json"
command=/usr/local/bin/suprclaw gateway
autorestart=true
priority=10
stdout_logfile=/var/log/suprclaw-engine-gateway.log
stderr_logfile=/var/log/suprclaw-engine-gateway.err
